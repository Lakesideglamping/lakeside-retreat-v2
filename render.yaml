services:
  - type: web
    # Must match the live Render service exactly. It is "lakeside-retreat-v2"
    # — the hostname lakeside-retreat-v2.onrender.com derives from it, and the
    # Stripe and Uplisting webhooks depend on that name staying put.
    name: lakeside-retreat-v2
    runtime: node
    plan: starter
    # npm ci first: Render only runs its default install when no custom build
    # command is set. Without it a cache-cleared build has no node_modules and
    # the first npx crashes with "Cannot read properties of null (edgesOut)".
    #
    # No prisma generate — the client is committed (see .gitignore). No
    # check:schema — that needs a throwaway database and runs in CI instead.
    #
    # NODE_OPTIONS stays attached to npm run build: a VAR=x prefix applies only
    # to the command it precedes, so moving it earlier would drop the memory
    # cap on the build itself, which is what it exists to protect.
    buildCommand: npm ci && npx prisma migrate deploy && npm run check:migrations && NODE_OPTIONS=--max-old-space-size=460 npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lakeside-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: UPLISTING_API_KEY
        sync: false
      - key: UPLISTING_WEBHOOK_SECRET
        sync: false
      - key: UPLISTING_PINOT_ID
        sync: false
      - key: UPLISTING_ROSE_ID
        sync: false
      - key: UPLISTING_COTTAGE_ID
        sync: false
      - key: EMAIL_HOST
        value: smtp.titan.email
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      - key: NEXT_PUBLIC_BASE_URL
        value: https://lakesideretreat.co.nz
      - key: NEXT_PUBLIC_WHATSAPP_PHONE
        sync: false
      - key: RESET_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: info
      # Keep the public site behind the maintenance page. Middleware
      # redirects every public route to /maintenance and robots.ts blocks
      # all crawlers, so nothing half-built gets indexed. /admin and /api
      # stay reachable so the site can be checked before opening it up.
      # Flip to "false" only when the site is meant to go publicly live.
      - key: MAINTENANCE_MODE
        value: "true"
      - key: ICAL_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false

  - type: cron
    name: lakeside-cron
    runtime: node
    plan: starter
    schedule: "0 * * * *"
    buildCommand: echo "no build needed"
    startCommand: bash scripts/cron-tick.sh
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: BASE_URL
        value: https://lakesideretreat.co.nz
